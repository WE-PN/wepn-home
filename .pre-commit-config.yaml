repos:
-   repo: https://github.com/pycqa/flake8
    rev: '4.0.0'
    hooks:
    -   id: flake8
        exclude: tests/

# this requires pip3 install bandit
# repo fails to run correctly
-   repo: local
    hooks:
    -   id: python-bandit-vulnerability-check
        entry: bandit
        name: bandit
        args: [-l, -x, "usr/local/pproxy/tests/"]
        language: system
        files: ''

-   repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
    -   id: python-safety-dependencies-check

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
#    -   id: detect-aws-credentials
    -   id: check-added-large-files
    -   id: detect-private-key
    -   id: debug-statements

- repo: local
  hooks:
  - id: pytest
    name: Run pytest
    entry: /var/local/pproxy/wepn-pytest/bin/python3 usr/local/pproxy/tests/run_tests_with_coverage.py --path=/var/local/pproxy/git/home_device/usr/local/pproxy/ --pytest=/var/local/pproxy/wepn-pytest/bin/pytest 
    language: system
    types: [python]
    pass_filenames: false
    always_run: false


[loggers]
keys=root,heartbeat,onboarding,startup,mqtt_forwarder,message_poller,msg_channel

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter,json

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_heartbeat]
level=DEBUG
handlers=fileHandler
qualname=heartbeat

[logger_startup]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=startup
propagate=0

[logger_onboarding]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=onboarding
propagate=0

[logger_mqtt_forwarder]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=mqtt_forwarder
propagate=0

[logger_message_poller]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=message_poller
propagate=0

[logger_msg_channel]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=msg_channel
propagate=0

[logger_local_api]
level=ERROR
handlers=consoleHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=json
# 10K log files, 3 backups
args=("/var/local/pproxy/error.log", 'a', 2048, 3)

[formatter_json]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(asctime)s %(levelno)s %(filename)s:%(lineno)d %(message)s

[formatter_simpleFormatter]
format=%(filename)s:%(lineno)d - %(levelname)s: %(message)s
